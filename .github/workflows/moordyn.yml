name: Linux GCC MoorDyn

# The actuator core and the MoorDyn-C line-dynamics coupling, twice: built against
# the bundled MoorDyn stub library (no MoorDyn installation needed) and against the
# real MoorDyn-C, installed with Build/setup_moordyn.sh. The stub job runs the
# actuator and conductor unit tests and the stub regression tests; the real job runs
# the same unit tests, the verification tests that need line dynamics (blowout angle,
# swing period) and the coupled regression test with its real-library gold. The
# anelastic FFT Poisson solve the decks use needs ERF_ENABLE_FFT, which the AMReX
# dependency script provides through libfftw3.

on:
  push:
    branches: [development, ERF-Structures]
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.event.pull_request.number || github.ref }}-${{ github.head_ref }}-moordyn
  cancel-in-progress: ${{ github.ref != 'refs/heads/development' }}

jobs:
  stub:
    name: GNU@9.3 C++17 - MoorDyn stub, actuator core
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:

    - uses: actions/checkout@v7
      with:
        submodules: true

    - name: Install Dependencies
      run: Submodules/AMReX/.github/workflows/dependencies/dependencies.sh

    - name: Install CCache
      run: Submodules/AMReX/.github/workflows/dependencies/dependencies_ccache.sh

    - name: Set Up Cache
      uses: actions/cache@v6
      with:
        path: ~/.cache/ccache
        key: ccache-${{ github.workflow }}-${{ github.job }}-git-${{ github.sha }}
        restore-keys: |
             ccache-${{ github.workflow }}-${{ github.job }}-git-

    - name: Configure Project and Generate Build System
      run: |
        cmake \
          -B${{runner.workspace}}/ERF/build \
          -DCMAKE_INSTALL_PREFIX:PATH=${{runner.workspace}}/ERF/install \
          -DCMAKE_BUILD_TYPE:STRING=RelWithDebInfo \
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
          -DERF_DIM:STRING=3 \
          -DERF_ENABLE_MPI:BOOL=ON \
          -DERF_ENABLE_FFT:BOOL=ON \
          -DERF_ENABLE_MOORDYN:BOOL=ON \
          -DERF_MOORDYN_USE_STUB:BOOL=ON \
          -DERF_ENABLE_TESTS:BOOL=ON \
          -DERF_ENABLE_UNIT_TESTS:BOOL=ON \
          -DERF_ENABLE_ALL_WARNINGS:BOOL=ON \
          -DERF_ENABLE_FCOMPARE:BOOL=ON \
          -DERF_TEST_NRANKS:STRING=2 \
          ${{github.workspace}};

    - name: Compile and Link
      run: |
        export CCACHE_COMPRESS=1
        export CCACHE_COMPRESSLEVEL=10
        export CCACHE_MAXSIZE=400M
        ccache -z

        cmake --build ${{runner.workspace}}/ERF/build --parallel 2 --verbose \
          2>&1 | tee -a ${{runner.workspace}}/build-output.txt;

        ccache -s
        du -hs ~/.cache/ccache

    - name: Report
      run: |
        egrep "Warning:|Error:|warning:|error:" ${{runner.workspace}}/build-output.txt \
          | egrep -v "Submodules/AMReX" | sort | uniq \
          | awk 'BEGIN{i=0}{print $0}{i++}END{print "Warnings: "i}' > ${{runner.workspace}}/build-output-warnings.txt
        cat ${{runner.workspace}}/build-output-warnings.txt
        export return=$(tail -n 1 ${{runner.workspace}}/build-output-warnings.txt | awk '{print $2}')
        exit ${return}

    - name: Actuator and MoorDyn Unit Tests
      run: |
        Tests/Unit/erf_unit_tests --gtest_filter='ActuatorSampling.*:ActuatorSpreading.*:WakeLines.*:RunningStats.*:MoorDynSystem.*:ConductorInputs.*:MoorDynInputWriter.*:ConductorSpan.*:Conductors.*:ConductorVerification.*'
      working-directory: ${{runner.workspace}}/ERF/build

    - name: Conductor Regression Tests
      run: |
        ctest -L conductors --output-on-failure --no-tests=error
      working-directory: ${{runner.workspace}}/ERF/build

    - name: Actuator Unit Tests on Two Ranks
      run: |
        ctest -R "erf_parallel_tests.Actuator" --output-on-failure --no-tests=error
      working-directory: ${{runner.workspace}}/ERF/build

    - name: Upload backtraces from failed tests
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: backtraces-moordyn-stub
        path: ${{runner.workspace}}/ERF/build/Tests/**/Backtrace.*
        if-no-files-found: ignore

  real:
    name: GNU@9.3 C++17 - MoorDyn-C 2.7.1, conductors
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:

    - uses: actions/checkout@v7
      with:
        submodules: true

    - name: Install Dependencies
      run: Submodules/AMReX/.github/workflows/dependencies/dependencies.sh

    - name: Install CCache
      run: Submodules/AMReX/.github/workflows/dependencies/dependencies_ccache.sh

    - name: Set Up Cache
      uses: actions/cache@v6
      with:
        path: ~/.cache/ccache
        key: ccache-${{ github.workflow }}-${{ github.job }}-git-${{ github.sha }}
        restore-keys: |
             ccache-${{ github.workflow }}-${{ github.job }}-git-

    - name: Install MoorDyn-C
      run: Build/setup_moordyn.sh --version 2.7.1 --prefix ${{runner.workspace}}/moordyn --src ${{runner.workspace}}/src --jobs 2

    - name: Configure Project and Generate Build System
      run: |
        cmake \
          -B${{runner.workspace}}/ERF/build \
          -DCMAKE_INSTALL_PREFIX:PATH=${{runner.workspace}}/ERF/install \
          -DCMAKE_BUILD_TYPE:STRING=RelWithDebInfo \
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
          -DERF_DIM:STRING=3 \
          -DERF_ENABLE_MPI:BOOL=ON \
          -DERF_ENABLE_FFT:BOOL=ON \
          -DERF_ENABLE_MOORDYN:BOOL=ON \
          -DMOORDYN_DIR:PATH=${{runner.workspace}}/moordyn \
          -DERF_ENABLE_TESTS:BOOL=ON \
          -DERF_ENABLE_UNIT_TESTS:BOOL=ON \
          -DERF_ENABLE_ALL_WARNINGS:BOOL=ON \
          -DERF_ENABLE_FCOMPARE:BOOL=ON \
          -DERF_TEST_NRANKS:STRING=2 \
          ${{github.workspace}};

    - name: Compile and Link
      run: |
        export CCACHE_COMPRESS=1
        export CCACHE_COMPRESSLEVEL=10
        export CCACHE_MAXSIZE=400M
        ccache -z

        cmake --build ${{runner.workspace}}/ERF/build --parallel 2 --verbose \
          2>&1 | tee -a ${{runner.workspace}}/build-output.txt;

        ccache -s
        du -hs ~/.cache/ccache

    - name: Report
      run: |
        egrep "Warning:|Error:|warning:|error:" ${{runner.workspace}}/build-output.txt \
          | egrep -v "Submodules/AMReX" | sort | uniq \
          | awk 'BEGIN{i=0}{print $0}{i++}END{print "Warnings: "i}' > ${{runner.workspace}}/build-output-warnings.txt
        cat ${{runner.workspace}}/build-output-warnings.txt
        export return=$(tail -n 1 ${{runner.workspace}}/build-output-warnings.txt | awk '{print $2}')
        exit ${return}

    - name: Actuator and MoorDyn Unit Tests
      run: |
        Tests/Unit/erf_unit_tests --gtest_filter='ActuatorSampling.*:ActuatorSpreading.*:WakeLines.*:RunningStats.*:MoorDynSystem.*:ConductorInputs.*:MoorDynInputWriter.*:ConductorSpan.*:Conductors.*:ConductorVerification.*'
      working-directory: ${{runner.workspace}}/ERF/build

    - name: Conductor Regression Tests
      run: |
        ctest -L conductors --output-on-failure --no-tests=error
      working-directory: ${{runner.workspace}}/ERF/build

    - name: Actuator Unit Tests on Two Ranks
      run: |
        ctest -R "erf_parallel_tests.Actuator" --output-on-failure --no-tests=error
      working-directory: ${{runner.workspace}}/ERF/build

    - name: Upload backtraces from failed tests
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: backtraces-moordyn-real
        path: ${{runner.workspace}}/ERF/build/Tests/**/Backtrace.*
        if-no-files-found: ignore
